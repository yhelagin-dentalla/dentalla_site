name: Deploy to Timeweb

concurrency:
  group: deploy-to-timeweb
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

            - name: Deploy via FTP (stable mode with diagnostics)
        run: |
          sudo apt-get install -y lftp

          for attempt in 1 2 3 4; do
            echo "======================================"
            echo "=== FTP deploy attempt $attempt of 4 ==="
            echo "======================================"

            timeout 300 lftp -d \
              -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
              "${{ secrets.FTP_SERVER }}" \
              -e "
                set ftp:ssl-allow no;
                set ftp:passive-mode yes;

                set net:timeout 30;
                set net:max-retries 6;
                set net:reconnect-interval-base 5;
                set net:reconnect-interval-multiplier 2;
                set net:reconnect-interval-max 30;

                set cmd:fail-exit yes;

                echo FTP connection established;
                pwd;
                ls /public_html;

                mirror \
                  --reverse \
                  --delete \
                  --verbose \
                  --exclude .git/ \
                  --exclude .github/ \
                  --exclude ^services-data\\.json$ \
                  ./ /public_html/;

                quit;
              "

            RESULT=$?

            if [ $RESULT -eq 0 ]; then
              echo "======================================"
              echo "Deploy succeeded on attempt $attempt"
              echo "======================================"
              exit 0
            fi

            echo "======================================"
            echo "Attempt $attempt failed with code $RESULT"
            echo "Waiting 45 seconds before retry..."
            echo "======================================"

            sleep 45
          done

          echo "All FTP deployment attempts failed"
          exit 1
