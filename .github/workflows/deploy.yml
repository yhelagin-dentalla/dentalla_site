name: Deploy to Timeweb

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP secrets
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "FTP_SERVER is empty"; exit 1; fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "FTP_USERNAME is empty"; exit 1; fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "FTP_PASSWORD is empty"; exit 1; fi
          echo "All FTP secrets are present"
          echo "Server: ${{ secrets.FTP_SERVER }}"
          echo "Username: ${{ secrets.FTP_USERNAME }}"
          echo "Password length: $(echo -n '${{ secrets.FTP_PASSWORD }}' | wc -c) chars"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        run: |
          sudo apt-get install -y lftp
          lftp -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }} -e "
            set ftp:ssl-allow yes
            set ftp:ssl-force no
            set ftp:passive-mode yes
            set net:timeout 30
            set net:max-retries 3
            mirror --reverse --delete --exclude .git/ --exclude .github/ ./ /public_html/
            quit
          "
