name: Deploy to Timeweb

concurrency:
  group: deploy-to-timeweb
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force-upload specific problem files
        run: |
          sudo apt-get install -y lftp
          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt of 5 ==="
            lftp -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }} -e "
              set ftp:ssl-allow no
              set ftp:passive-mode yes
              set net:timeout 20
              set net:max-retries 2
              set net:reconnect-interval-base 3
              cd /public_html/
              put -O /public_html/ doctor_fursa.webp
              put -O /public_html/ child.webp
              put -O /public_html/ doctor_elagina.webp
              put -O /public_html/ about_doctors.webp
              quit
            " && { echo "Deploy succeeded on attempt $attempt"; exit 0; }
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "All attempts failed"
          exit 1
