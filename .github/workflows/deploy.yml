name: Deploy to Timeweb

concurrency:
  group: deploy-to-timeweb
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP (full sync, with auto-retry)
        run: |
          sudo apt-get install -y lftp
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt of 3 ==="
            timeout 180 lftp -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }} -e "
              set ftp:ssl-allow no
              set ftp:passive-mode yes
              set net:timeout 15
              set net:max-retries 2
              set net:reconnect-interval-base 3
              mirror --reverse --delete --exclude .git/ --exclude .github/ --parallel=2 ./ /public_html/
              quit
            " && { echo "Deploy succeeded on attempt $attempt"; exit 0; }
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          echo "All attempts failed"
          exit 1
