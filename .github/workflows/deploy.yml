name: Deploy to Timeweb

on:
  push:
    branches: [main]

concurrency:
  group: deploy-to-timeweb
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed files
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          if [ -z "$BEFORE" ]; then
            echo "No previous commit found, doing full deploy"
            git ls-files | grep -v "^\.github/" > /tmp/added_modified.txt
            > /tmp/deleted.txt
          else
            git diff --name-only --diff-filter=ACMR "$BEFORE" "${{ github.sha }}" -- . ":(exclude).github" > /tmp/added_modified.txt
            git diff --name-only --diff-filter=D "$BEFORE" "${{ github.sha }}" -- . ":(exclude).github" > /tmp/deleted.txt
          fi
          echo "--- Files to upload ---"
          cat /tmp/added_modified.txt
          echo "--- Files to delete ---"
          cat /tmp/deleted.txt

      - name: Deploy changed files via FTP
        run: |
          sudo apt-get install -y lftp
          if [ ! -s /tmp/added_modified.txt ] && [ ! -s /tmp/deleted.txt ]; then
            echo "No file changes to deploy."
            exit 0
          fi

          CMDS="set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 20; set net:max-retries 3; set net:reconnect-interval-base 3;"

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            dir=$(dirname "$f")
            if [ "$dir" != "." ]; then
              CMDS="$CMDS mkdir -p -f /public_html/$dir;"
            fi
            CMDS="$CMDS put \"$f\" -o \"/public_html/$f\";"
          done < /tmp/added_modified.txt

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            CMDS="$CMDS rm -f \"/public_html/$f\";"
          done < /tmp/deleted.txt

          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt of 5 ==="
            lftp -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }} -e "$CMDS quit" \
              && { echo "Deploy succeeded on attempt $attempt"; exit 0; }
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "All attempts failed"
          exit 1
