<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Диагностика SmartCaptcha</title><style>body{font:16px system-ui;max-width:560px;margin:48px auto;padding:0 20px}#captcha{min-height:100px}button{padding:12px 20px}#status{white-space:pre-wrap}</style><h1>Диагностика SmartCaptcha</h1><p>Тестовая страница. Заявки и письма не отправляются.</p><div id="captcha"></div><button id="verify" disabled>Проверить токен на сервере</button><p id="status" role="status">Загрузка конфигурации…</p><script>
(async()=>{const status=document.getElementById('status'),btn=document.getElementById('verify');let widget;
try{const r=await fetch('/smartcaptcha-check.php',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.sitekey)throw Error(d.status);status.textContent='Конфигурация доступна. PHP cURL: '+(d.curl?'да':'нет');
window.dentallaDiagnosticReady=()=>{try{widget=window.smartCaptcha.render('captcha',{sitekey:d.sitekey,hl:'ru',callback:()=>{btn.disabled=false;}});window.smartCaptcha.subscribe(widget,'token-expired',()=>{btn.disabled=true;});}catch(e){status.textContent='Ошибка виджета: '+e.message;}};
const script=document.createElement('script');script.src='https://smartcaptcha.cloud.yandex.ru/captcha.js?render=onload&onload=dentallaDiagnosticReady';script.onerror=()=>status.textContent='Ошибка загрузки библиотеки Яндекса';document.head.append(script);
btn.onclick=async()=>{btn.disabled=true;try{const token=window.smartCaptcha.getResponse(widget);const r=await fetch('/smartcaptcha-check.php',{method:'POST',body:new URLSearchParams({'smart-token':token})});const data=await r.json();status.textContent=data.status==='verified'?'УСПЕХ: сервер Яндекса подтвердил токен.':'Результат: '+data.status;}catch(e){status.textContent='Ошибка запроса: '+e.message;}finally{window.smartCaptcha.reset(widget);}};
}catch(e){status.textContent='Ошибка конфигурации: '+e.message;}})();
</script></html>
